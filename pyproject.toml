[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desitter-qft"
version = "0.1.0"
description = "Quantum fields on a fixed de Sitter background: modes, vacua, correlators, in-in perturbation theory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "sympy>=1.12", "mpmath>=1.3", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat", "nbclient", "ipykernel"]

[project.scripts]
desitter-qft = "desitter_qft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slower numerical tests"]
